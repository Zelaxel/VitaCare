<div class="report">
  <section class="report-buttons">
    <button [routerLink]="['/patient/home']" class="back-button">
      <img src="svg/left_arrow.svg">
    </button>
    <button class="download-button">
      <img src="svg/download.svg">
    </button>
  </section>
  <section class="appointment-info">
    <section class="appointment-details">
      <section class="appointment-patient">
        <label>Patient name:</label>
        <label class="patient-name-label">{{patientName}}</label>
      </section>
      <section>
        <label>Doctor:</label>
        <label class="doctor-name-label">{{doctorName}}</label>
      </section>
      <section>
        <label>Date: </label>
        <label class="date-label">{{date}}</label>
      </section>
      <section>
        <label>Department: </label>
        <label class="department-label">{{department}}</label>
      </section>
    </section>
    <section class="appointment-reason">
      <label>Appointment reason:</label>
      <label class ="appointment-reason-label">{{reason}}</label>
    </section>
    <section class="appointment-conclusion">
      <label>Appointment conclusion:</label>
      <label class="appointment-conclusion-label">{{conclusion}}</label>
    </section>
  </section>
</div>
