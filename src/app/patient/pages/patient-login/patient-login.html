<div class="login-container">
    <img src="svg\Vital Care (logo).svg"> 
    <hr class="separator">

    <div class="button-group">
        <a href="/doctor/doctor-login">
            <button type="button" class="btn-alt">Change to doctor</button>
        </a>
    </div>

    <div class="login-forms">
        <label for="passport">ID / Passport</label>
        <input type="text" id="passport">
    </div>

    <div class="login-forms">
        <label for="password">Password</label>
        <div class="input-group">
            <input type="password" id="password" #passwordInput>
            
            <img 
            [src]="passwordInput.type === 'password' ? 'svg/eye-closed.svg' : 'svg/eye.svg'" 
            (click)="passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password'"
            class="toggle-icon"
            >
        </div>
    </div>

    <a href="patient\home">
        <button aria-label="Close">Sign in</button>
    </a>
    
    <hr class="separator">

    <a href="...">Request technical support</a>
    <a href= "patient/register">Register</a>
</div>
