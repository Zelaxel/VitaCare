<div class="login-container">
    <img src="svg\Vital Care (logo).svg"> 
    <hr class="separator">

    <div class="button-group">
        <a [routerLink]="['/login/doctor-log-in']">
            <button type="button" class="btn-alt">Change to doctor</button>
        </a>
    </div>

    <div class="login-forms">
        <label for="id">ID / Passport</label>
        <div class="input-wrapper"> 
            <input type="text" [(ngModel)]="id" id="id">
            @if (isIdInvalid) {
                <span class="error-icon">!</span>
                <small class="error-text">
                    The format must be 8 numbers and one valid letter.
                </small>
            }
        </div>
    </div>

    <div class="login-forms">
        <label for="password">Password</label>
        <div class="input-group">
            <input type="password" [(ngModel)]="password" id="password" #passwordInput>
            <div class="input-wrapper_v2">
                @if (isPasswordInvalid) {
                    <span class="error-icon">!</span>
                    <small class="error-text">
                        Minimum 8 characters, one uppercase letter, one number and one symbol.
                    </small>
                }
            </div>
            
            <img 
            [src]="passwordInput.type === 'password' ? 'svg/eye-closed.svg' : 'svg/eye.svg'" 
            (click)="passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password'"
            class="toggle-icon"
            >
        </div>
    </div>

    @if (loginErrorMessage) {
    <div class="global-error-banner">
        {{ loginErrorMessage }}
    </div>
}

    <button aria-label="Close" (click)="onLogin()">Sign in</button>
    
    <hr class="separator">

    <a href="...">Request technical support</a>
    <a [routerLink]="['/login/register']" >Register</a>
</div>
