<div class="login-container">
    <img src="svg\Vital Care (logo).svg"> 
    <hr class="separator">

    <div class="button-group">
        <a [routerLink]="['/login/log-in']">
            <button type="button" class="btn-alt">Change to patient</button>
        </a>
    </div>

    <div class="login-forms">
        <label for="credentials">Credentials</label>
        <input type="text" [(ngModel)]="loginData.credentials" id="credentials">
    </div>

    <div class="login-forms">
        <label for="password">Password</label>
        <div class="input-group">
            <input type="password" [(ngModel)]="loginData.password" id="password" #passwordInput>
            
            <img 
            [src]="passwordInput.type === 'password' ? 'svg/eye-closed.svg' : 'svg/eye.svg'" 
            (click)="passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password'"
            class="toggle-icon"
            >
        </div>
    </div>

    @if (loginErrorMessage) {
        <div class="global-error-banner">
            {{ loginErrorMessage }}
        </div>
    }

    <button type="button" (click)="onLogin()" aria-label="Close">Sign in</button>
    
    <hr class="separator">

    <a href="...">Request technical support</a>
</div>
