<div class="recovery-page">
  <div class="layout-window">

    <main class="main-area">
      <button onclick="window.history.back()" class="back-button">
        <img src="svg/left_arrow.svg" alt="back">
      </button>
      <section class="recovery-card">
        <img src="svg\padlock-locke.svg">

        <h1>Account Recovery</h1>

        <div class="title-line"></div>

        <p class="description">
          Enter your email and we’ll send you instructions to recover your
          account credentials.
        </p>

        <div class="email-area">
          <label for="email">Email</label>

          <div class="input-box">
            <svg class="mail-svg" viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="14" rx="1"></rect>
              <path d="M4 7l8 6 8-6"></path>
            </svg>

            <input id="email" type="email" placeholder="Enter your email" [(ngModel)]="emailInput" name="email" />
          </div>
        </div>

        <button class="send-btn" type="button" (click)="recoverPassword()">Send Password</button>

      </section>
    </main>
  </div>
</div>
