<div class="recovery-page">
  <p class="page-title">Recupero credenciales</p>

  <div class="layout-window">
    <header class="top-bar">
      <div class="image-icon">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <path d="M21 16l-5-5L5 21"></path>
        </svg>
      </div>

      <div class="top-actions">
        <div class="user-circle">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 21c1.8-5 14.2-5 16 0"></path>
          </svg>
        </div>
        <button class="settings-btn" type="button">Settings</button>
      </div>
    </header>

    <main class="main-area">
      <section class="recovery-card">
        <div class="lock-circle">
          <svg class="lock-svg" viewBox="0 0 64 64">
            <rect x="16" y="28" width="32" height="26" rx="4"></rect>
            <path d="M22 28v-9c0-8 4-13 10-13s10 5 10 13v9"></path>
          </svg>
        </div>

        <h1>Account Recovery</h1>

        <div class="title-line"></div>

        <p class="description">
          Enter your email and we’ll send you instructions to recover your
          account credentials.
        </p>

        <div class="email-area">
          <label for="email">Email</label>

          <div class="input-box">
            <svg class="mail-svg" viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="14" rx="1"></rect>
              <path d="M4 7l8 6 8-6"></path>
            </svg>

            <input id="email" type="email" placeholder="Enter your email" />
          </div>
        </div>

        <button class="send-btn" type="button">Send Instructions</button>

        <div class="divider">
          <span class="line"></span>
          <span class="or-text">or</span>
          <span class="line"></span>
        </div>

        <div class="back-login">
          <span class="arrow">←</span>
          <span>Back to login</span>
        </div>
      </section>
    </main>
  </div>
</div>
