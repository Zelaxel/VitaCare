<div class="sent-page">
  

  <div class="layout-window">
    

    <main class="main-area">
      <section class="sent-card">
        <div class="check-circle">
         <img src="svg\padlock-unlocked.svg">
        </div>

        <h1>Email Sent!</h1>

        <div class="title-line"></div>

        <p class="description">
          We’ve sent you an email with instructions to recover your account
          credentials.
        </p>

        <h2>Check your email box</h2>

        <div class="mail-big">
          <img src="svg/envelope-check.svg" class="mail-big-svg">
        </div>
      
        <button class="back-btn" type="button" [routerLink]="['/login/log-in']">Back to login</button>
        
      </section>
    </main>
  </div>
</div>
