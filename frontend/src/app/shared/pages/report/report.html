<app-header></app-header>

<div class="report">
  <section class="report-buttons">
    <button onclick="window.history.back()" class="back-button">
      <img src="svg/left_arrow.svg" alt="back">
    </button>
    <button class="download-button" (click)="downloadPDF()">
      <img src="svg/download.svg" alt="download">
    </button>
  </section>
  <section class="appointment-info" [class.doctor-theme]="!isPatient()" [class.patient-theme]="isPatient()">
    <section class="appointment-details">
      <section class="appointment-patient">
        <label>Patient name:</label>
        <label class="patient-name-label">{{patientName}}</label>
      </section>
      <section>
        <label>Doctor:</label>
        <label class="doctor-name-label">{{doctorName}}</label>
      </section>
      <section>
        <label>Date: </label>
        <label class="date-label">{{date | date:'yyyy-MM-dd HH:mm'}}</label>
      </section>
      <section>
        <label>Department: </label>
        <label class="department-label">{{department | titlecase}}</label>
      </section>
    </section>
    <section class="appointment-reason">
      <label>Appointment reason:</label>
      <label class ="appointment-reason-label">{{reason}}</label>
    </section>
    <section class="appointment-conclusion">
      <label>Appointment conclusion:</label>
      <label class="appointment-conclusion-label">{{conclusion}}</label>
    </section>
    <section class="appointment-import">
      <label>Import:</label>
      <label class="appointment-import-label">{{ price }} €</label>
    </section>
    <section class="appointment-paid">
      <label>Paid state:</label>
      <label class="appointment-paid-label">
        {{ paidState ? 'Complete' : 'Pending' }}
      </label>
    </section>

    @if(!paidState){
      <button class="pay-button" (click)="goToPayment()">Pay appointment</button>
    }
  </section>
</div>
