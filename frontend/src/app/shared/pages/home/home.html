<app-header></app-header>

<div class="homepage" [class.doctor-theme]="!isPatient()" [class.patient-theme]="isPatient()">
  <form class="homepage-form container" (submit)="$event.preventDefault()">
    <div class="search-bar">
      <app-search-bar (searchChange)="onSearch($event)"></app-search-bar>
    </div>
    <div class="wrap">
      <div class="form-dates container">
        <label class="date-label container">
          START RANGE
          <input class="date-input" type="date" [(ngModel)]="startDate" name="start">
        </label>
        <div class="separator">
          <img src="svg/simple_line.svg">
          <img src="svg/simple_line.svg">
        </div>
        <label class="date-label container">
          FINISH RANGE
          <input class="date-input" type="date" [(ngModel)]="endDate" name="end">
        </label>
      </div>
      @if(isPatient()){
        <select
          class="department-select"
          [(ngModel)]="selectedDepartment"
          name="department"
        >
          <option value="" disabled selected>○○ Departament ○○</option>
          <option *ngFor="let dep of departments" [value]="dep">
              {{ dep | titlecase}}
            </option>
        </select>
      }
      <div class="form-buttons container">
        <button class="filter-button" (click)="applyDateFilter()" type="button">Filter</button>
<button class="clear-filter-button" (click)="clearFilters()" type="button">Clear filter</button>
        @if(isPatient()){
          <button type="button" (click)="handleCreateAppointment()" class="create-button">Create appointment</button>
        }
      </div>
    </div>
  </form>

  <main class="homepage-main container">
    <app-appointment-grid (deletedAppointment)="refreshAppointments()" [isPatient]="isPatient()" [appointments]="appointments"></app-appointment-grid>
  </main>
</div>
