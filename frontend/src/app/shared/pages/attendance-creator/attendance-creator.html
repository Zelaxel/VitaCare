<app-header></app-header>
<main class="outer-panel">

  <section class="page-buttons">
    <button onclick="window.history.back()" class="back-button">
      <img src="/svg/left_arrow.svg" alt="Back">
    </button>
  </section>

  <section class="form-card">
    <h1>Medical appointment form</h1>
    <div class="title-line"></div>

    <div class="form-grid">
      <div class="left-column">
        <label for="department">Department</label>
        <select id="department" [(ngModel)]="department">
          <option value="">Select anyone</option>
          <option>Cardiology</option>
          <option>Dermatology</option>
          <option>Pediatrics</option>
        </select>

        <label for="doctor">Doctor</label>
        <select id="doctor" [(ngModel)]="doctor">
          <option value="">Select anyone</option>
          <option>Dr. García</option>
          <option>Dra. López</option>
          <option>Dr. Pérez</option>
        </select>

        <div class="date-input-wrapper">
          <input class="date-input" type="text" placeholder="08/17/2025" [(ngModel)]="date">
          <span class="calendar-icon">🗓️</span>
        </div>

        <div class="fake-calendar">
          <div class="calendar-header">
            <span class="nav-arrow">‹</span>
            <span class="month-label">Aug</span>
            <span class="small-arrow">⌄</span>

            <span class="header-spacer"></span>

            <span class="nav-arrow">‹</span>
            <span class="year-label">2025</span>
            <span class="small-arrow">⌄</span>
            <span class="nav-arrow">›</span>
          </div>

          <div class="calendar-days">
            <span>S</span>
            <span>M</span>
            <span>T</span>
            <span>W</span>
            <span>T</span>
            <span>F</span>
            <span>S</span>
          </div>

          <div class="calendar-dates">
            <span class="muted">26</span>
            <span class="muted">27</span>
            <span class="muted">28</span>
            <span class="muted">29</span>
            <span class="muted">30</span>
            <span class="muted">31</span>
            <span>1</span>

            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>5</span>
            <span>6</span>
            <span>7</span>
            <span>8</span>

            <span>9</span>
            <span>10</span>
            <span>11</span>
            <span>12</span>
            <span>13</span>
            <span>14</span>
            <span>15</span>

            <span>16</span>
            <span class="selected">17</span>
            <span>18</span>
            <span>19</span>
            <span>20</span>
            <span>21</span>
            <span>22</span>

            <span>23</span>
            <span>24</span>
            <span>25</span>
            <span>26</span>
            <span>27</span>
            <span>28</span>
            <span>29</span>

            <span>30</span>
            <span class="muted">1</span>
            <span class="muted">2</span>
            <span class="muted">3</span>
            <span class="muted">4</span>
            <span class="muted">5</span>
            <span class="muted">6</span>
          </div>

          <div class="calendar-footer">
            <span>Cancel</span>
            <span>OK</span>
          </div>
        </div>
      </div>

      <div class="vertical-divider"></div>

      <div class="right-column">
        <label for="matter">Medical matter</label>
        <input id="matter" type="text" [(ngModel)]="medicalMatter">

        <label for="explanation">Explanation</label>
        <textarea id="explanation" [(ngModel)]="explanation"></textarea>

        <label class="checkbox-row">
          <input type="checkbox" [(ngModel)]="notifications">
          <span>Activate automatic notifications</span>
        </label>

        <div class="buttons">
          <button class="update-btn" type="button">Update</button>
          <button class="create-btn" type="button" (click)="createAppointment()">Create</button>
        </div>
      </div>
    </div>
  </section>
</main>
