<app-header></app-header>

<div class="report">
  <section class="report-buttons">
    <button (click)="goBack()" class="back-button">
      <img src="svg/left_arrow.svg" alt="Back" />
    </button>
  </section>

  <section class="appointment-info">
    
    <section class="appointment-details">
      <section class="appointment-patient">
        <label>Patient name:</label>
        <label class="patient-name-label">{{patientName}}</label>
      </section>

      <section>
        <label>Doctor:</label>
        <label class="doctor-name-label">{{doctorName}}</label>
      </section>

      <section>
        <label>Date:</label>
        <label class="date-label">{{date | date:'dd/MM/yyyy'}}</label>
      </section>

      <section>
        <label>Department:</label>
        <label class="department-label">{{department}}</label>
      </section>
    </section>

    <hr class="divider" />

    <section class="appointment-reason">
      <label>Appointment reason:</label>
      <label class="appointment-reason-label">{{reason}}</label>
    </section>

    <hr class="divider" />

    <section class="appointment-conclusion-edit">
      <label for="conclusion-input">Doctor's conclusion:</label>
      <textarea 
        id="conclusion-input"
        class="conclusion-textarea" 
        [(ngModel)]="conclusion" 
        placeholder="Type the conclusion here...">
      </textarea>
    </section>

    <section class="submit-section">
      <button class="submit-button" (click)="submitReport()">
        Submit report
      </button>
    </section>

  </section> 
</div>
